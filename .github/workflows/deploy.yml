name: Deploy React App to WebSupport FTPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Deploy via FTPS using curl
        run: |
          echo "Uploading files via FTPS..."
          curl -k --ftp-ssl \
            --user "${{ secrets.FTP_USER }}:${{ secrets.FTP_PASSWORD }}" \
            --ftp-method nocwd \
            --upload-file build/index.html "ftps://${{ secrets.FTP_HOST }}/index.html"

          # upload entire build folder recursively
          for file in $(find build -type f); do
            remote_path="${file#build/}"
            echo "Uploading: $remote_path"
            curl -k --ftp-ssl \
              --user "${{ secrets.FTP_USER }}:${{ secrets.FTP_PASSWORD }}" \
              --ftp-create-dirs \
              --upload-file "$file" \
              "ftps://${{ secrets.FTP_HOST }}/$remote_path"
          done