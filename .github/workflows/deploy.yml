name: Deploy React App to WebSupport via FTP

on:
  push:
    branches:
      - main   # deploy spustí pri pushi do main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Deploy via FTPS
        uses: SamKirkland/FTPS-Deploy-Action@v1
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: build/
          server-dir: /
          protocol: ftps
          exclude: |
            **/.htaccess